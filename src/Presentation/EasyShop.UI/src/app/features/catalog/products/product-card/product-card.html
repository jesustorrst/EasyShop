<div class="card product-card h-100 border-0 shadow-sm">
  <div class="product-image-container">
    <img
      [src]="product().imageUrl"
      class="product-image"
      [alt]="product().name || 'Producto por defecto'"
      (error)="handleImageError($event)"
    />
  </div>

  <div class="card-body d-flex flex-column">
    <div>
      <h5 class="fw-bold text-dark mb-2 text-truncate" [title]="product().name">
        {{ product().name }}
      </h5>

      <p class="text-muted small mb-3 description" [title]="product().description">
        {{ product().description }}
      </p>
    </div>

    <div class="mt-auto">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge bg-success-subtle text-success px-3 py-2 fs-6">
          {{ product().price | currency: 'MXN' : 'symbol' : '1.2-2' }}
        </span>
      </div>

      <div class="d-grid gap-2">
        <a [routerLink]="['/catalogo/productos/edit', product().id]" class="btn btn-primary">
          <i class="bi bi-pencil-square me-1"></i>
          Editar
        </a>

        <button (click)="onDelete(product().id)" class="btn btn-outline-danger">
          <i class="bi bi-trash me-1"></i>
          Eliminar
        </button>
      </div>
    </div>
  </div>
</div>
