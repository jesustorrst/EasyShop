<div class="container py-5">
  <div class="bg-white rounded-4 shadow-sm p-4 mb-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
      <div>
        <h1 class="fw-bold mb-1">Catálogo de Productos</h1>

        <p class="text-muted mb-0">Administra los productos disponibles en EasyShop</p>
      </div>

      <a routerLink="/catalogo/productos/add" class="btn btn-success btn-lg">
        <i class="bi bi-plus-circle me-2"></i>
        Nuevo Producto
      </a>
    </div>
  </div>

  @if (productService.loading()) {
    <div class="text-center py-5">
      <div
        class="spinner-border text-primary"
        style="width: 4rem; height: 4rem"
        role="status"
      ></div>

      <h5 class="mt-4 text-muted">Cargando productos...</h5>
    </div>
  } @else {
    <div class="row g-4">
      @for (item of productService.products(); track item.id) {
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
          <app-product-card [product]="item"> </app-product-card>
        </div>
      } @empty {
        <div class="col-12">
          <div class="alert alert-light text-center border shadow-sm py-5">
            <i class="bi bi-box-seam display-4 text-secondary"></i>

            <h4 class="mt-3">No hay productos disponibles</h4>

            <p class="text-muted mb-0">Agrega tu primer producto para comenzar.</p>
          </div>
        </div>
      }
    </div>
  }
</div>
